<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TQ 1-6 Quiz 11</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { 
            background: #ffffff; margin: 0; padding: 20px; 
            font-family: 'Caveat', cursive; color: #222; font-size: 24px; 
        }
        .blatt { width: 100%; max-width: 800px; margin: 0 auto; padding: 40px; }
        h2 { border-bottom: 3px solid #000; padding-bottom: 15px; font-size: 36px; margin-bottom: 30px; }
        .question { font-weight: bold; margin-bottom: 20px; font-size: 28px; }
        .options { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; }
        button { 
            background: #f0f0f0; border: 1px solid #333; padding: 10px 20px; 
            cursor: pointer; font-family: 'Caveat', cursive; font-size: 22px; 
            border-radius: 8px; text-align: left;
        }
        button:hover { background: #e0e0e0; }
        .correct { background: #d4edda !important; border-color: #28a745 !important; }
        .incorrect { background: #f8d7da !important; border-color: #d63031 !important; }
        #feedback { margin-bottom: 20px; padding: 15px; border-radius: 8px; display: none; }
        #next-btn { background: #333; color: #fff; padding: 10px 25px; border-radius: 8px; border: none; cursor: pointer; }
    </style>
</head>
<body>
<div class="blatt">
    <h2 id="header">🚛 BKrFQG TQ 1-6 Quiz 11</h2>
    <div id="quiz-container">
        <div id="question-text" class="question"></div>
        <div id="options" class="options"></div>
        <div id="feedback"></div>
        <button id="next-btn" style="display:none" onclick="nextQuestion()">Nächste Frage</button>
    </div>
</div>

<script>
const quizData = [
    { q: "Welche maximale Abweichung beim Reifendruck ist für den Kraftstoffverbrauch relevant?", a: ["Keine", "0,2 bar unter Soll", "0,5 bar über Soll", "Der Druck ist egal"], c: 1 },
    { q: "Was passiert mit dem Bremsweg bei einer Nässe-Fahrbahn?", a: ["Er bleibt gleich", "Er verlängert sich erheblich", "Er verkürzt sich", "Er spielt keine Rolle"], c: 1 },
    { q: "Wie nennt man die Zeit, die man nach 4,5 Stunden Lenkzeit einlegen muss?", a: ["Tagesruhezeit", "Lenkzeitunterbrechung", "Wochenruhezeit", "Bereitschaftszeit"], c: 1 },
    { q: "Welche Dokumente müssen bei einer Gefahrgutfahrt immer dabei sein?", a: ["Beförderungspapier (ADR)", "Mietvertrag", "Versicherungspolice", "Rechnung"], c: 0 },
    { q: "Warum darf der Motor im Stand nicht unnötig laufen?", a: ["Wegen der Umwelt und Lärmschutz", "Weil er zu heiß wird", "Weil der Tank leer wird", "Weil die Batterie leer wird"], c: 0 },
    { q: "Was bedeutet das Symbol 'Hammer' auf dem Tachographen?", a: ["Lenkzeit", "Ruhezeit", "Sonstige Arbeit", "Verfügbarkeitszeit"], c: 2 },
    { q: "Was ist ein wichtiger Sicherheitsaspekt beim Abbiegen nach rechts?", a: ["Schnelligkeit", "Schulterblick/Toter Winkel", "Radio ausschalten", "Fenster öffnen"], c: 1 },
    { q: "Was passiert, wenn die Ladungssicherung nicht vorschriftsmäßig ist?", a: ["Höhere Geschwindigkeit", "Bußgeld & Gefahr für andere", "Der LKW wird leichter", "Bessere Kurvenlage"], c: 1 },
    { q: "Was regelt die Richtlinie 'VDI 2700'?", a: ["Technik der Ladungssicherung", "Fahrer-Ruhezeiten", "LKW-Bauweise", "Mautabrechnung"], c: 0 },
    { q: "Welcher Effekt tritt bei hoher Geschwindigkeit und Aquaplaning auf?", a: ["Mehr Grip", "Bessere Lenkbarkeit", "Kontrollverlust (Aufschwimmen)", "Spritersparnis"], c: 2 }
];

let currentQ = 0; let score = 0;

function loadQuestion() {
    const data = quizData[currentQ];
    document.getElementById('question-text').innerText = (currentQ + 1) + ". " + data.q;
    const container = document.getElementById('options');
    container.innerHTML = '';
    document.getElementById('feedback').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';
    data.a.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.innerText = opt;
        btn.onclick = () => check(i);
        container.appendChild(btn);
    });
}
function check(i) {
    const d = quizData[currentQ];
    const btns = document.querySelectorAll('.options button');
    btns.forEach(b => b.disabled = true);
    if(i === d.c) {
        btns[i].classList.add('correct');
        score++;
    } else {
        btns[i].classList.add('incorrect');
        btns[d.c].classList.add('correct');
    }
    document.getElementById('feedback').style.display = 'block';
    document.getElementById('feedback').innerText = i === d.c ? "Richtig!" : "Falsch.";
    document.getElementById('next-btn').style.display = 'block';
}
function nextQuestion() {
    currentQ++;
    if(currentQ < quizData.length) loadQuestion();
    else document.getElementById('quiz-container').innerHTML = `<h1>Fertig!</h1><p>Punktzahl: ${score} / ${quizData.length}</p>`;
}
loadQuestion();
</script>
</body>
</html>
