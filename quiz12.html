<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TQ 1-6 Quiz 12</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { 
            background: #ffffff; margin: 0; padding: 20px; 
            font-family: 'Caveat', cursive; color: #222; font-size: 24px; 
        }
        .blatt { width: 100%; max-width: 800px; margin: 0 auto; padding: 40px; }
        h2 { border-bottom: 3px solid #000; padding-bottom: 15px; font-size: 36px; margin-bottom: 30px; }
        .question { font-weight: bold; margin-bottom: 20px; font-size: 28px; }
        .options { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; }
        button { 
            background: #f0f0f0; border: 1px solid #333; padding: 10px 20px; 
            cursor: pointer; font-family: 'Caveat', cursive; font-size: 22px; 
            border-radius: 8px; text-align: left;
        }
        button:hover { background: #e0e0e0; }
        .correct { background: #d4edda !important; border-color: #28a745 !important; }
        .incorrect { background: #f8d7da !important; border-color: #d63031 !important; }
        #feedback { margin-bottom: 20px; padding: 15px; border-radius: 8px; display: none; }
        #next-btn { background: #333; color: #fff; padding: 10px 25px; border-radius: 8px; border: none; cursor: pointer; }
    </style>
</head>
<body>
<div class="blatt">
    <h2 id="header">🚛 BKrFQG TQ 1-6 Quiz 12</h2>
    <div id="quiz-container">
        <div id="question-text" class="question"></div>
        <div id="options" class="options"></div>
        <div id="feedback"></div>
        <button id="next-btn" style="display:none" onclick="nextQuestion()">Nächste Frage</button>
    </div>
</div>

<script>
const quizData = [
    { q: "Welche physikalische Größe reduziert die Rutschgefahr bei Ladungssicherung primär?", a: ["Gewicht", "Reibung", "Geschwindigkeit", "Luftdruck"], c: 1 },
    { q: "Was versteht man unter dem 'toten Winkel' beim LKW?", a: ["Bereich direkt hinter dem LKW", "Nicht einsehbarer Bereich neben dem Fahrzeug", "Bereich vor der Windschutzscheibe", "Bereich unter dem Fahrzeug"], c: 1 },
    { q: "Wie wird das ADR-Beförderungspapier bei einer Kontrolle geprüft?", a: ["Durch Abgleich mit der Ladung", "Es muss nur im LKW liegen", "Es wird nur bei Unfällen geprüft", "Es ist nicht notwendig"], c: 0 },
    { q: "Welche Auswirkungen hat ein zu niedriger Reifendruck?", a: ["Höherer Kraftstoffverbrauch & Verschleiß", "Bessere Kurvenlage", "Sichereres Bremsen", "Niedrigerer Spritverbrauch"], c: 0 },
    { q: "Wann muss eine Ladungssicherung spätestens überprüft werden?", a: ["Nur bei Ankunft", "Regelmäßig während der Fahrt", "Alle 500 km", "Gar nicht"], c: 1 },
    { q: "Was regelt die Verordnung (EG) Nr. 561/2006?", a: ["Lenk- und Ruhezeiten", "Ladungssicherung", "Mautsysteme", "Wartungsintervalle"], c: 0 },
    { q: "Was ist das Hauptziel von 'Eco-Driving'?", a: ["Spritsparendes Fahren", "Schnelleres Ankommen", "Maximale Leistung", "Besseres Bremsverhalten"], c: 0 },
    { q: "Was ist bei einem 'Reifenplatzer' unbedingt zu vermeiden?", a: ["Hektisches Lenken", "Festhalten des Lenkrads", "Kontrolliertes Bremsen", "Warnblinkanlage an"], c: 0 },
    { q: "Was gehört zwingend zur täglichen Abfahrtskontrolle?", a: ["Lichter, Reifen, Bremsen", "Radioeinstellung", "Sitzkomfort", "Ladungsinhalt prüfen"], c: 0 },
    { q: "Welches Bauteil verhindert das Lösen des Aufliegers bei einem Unfall?", a: ["Sattelkupplung", "Kardanwelle", "Stoßstange", "Spiegel"], c: 0 }
];

let currentQ = 0; let score = 0;

function loadQuestion() {
    const data = quizData[currentQ];
    document.getElementById('question-text').innerText = (currentQ + 1) + ". " + data.q;
    const container = document.getElementById('options');
    container.innerHTML = '';
    document.getElementById('feedback').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';
    data.a.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.innerText = opt;
        btn.onclick = () => check(i);
        container.appendChild(btn);
    });
}
function check(i) {
    const d = quizData[currentQ];
    const btns = document.querySelectorAll('.options button');
    btns.forEach(b => b.disabled = true);
    if(i === d.c) {
        btns[i].classList.add('correct');
        score++;
    } else {
        btns[i].classList.add('incorrect');
        btns[d.c].classList.add('correct');
    }
    document.getElementById('feedback').style.display = 'block';
    document.getElementById('feedback').innerText = i === d.c ? "Richtig!" : "Falsch.";
    document.getElementById('next-btn').style.display = 'block';
}
function nextQuestion() {
    currentQ++;
    if(currentQ < quizData.length) loadQuestion();
    else document.getElementById('quiz-container').innerHTML = `<h1>Fertig!</h1><p>Punktzahl: ${score} / ${quizData.length}</p>`;
}
loadQuestion();
</script>
</body>
</html>
