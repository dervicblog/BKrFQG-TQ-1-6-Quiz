<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TQ 1-6 Quiz 16</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
        <style>
            * { box-sizing: border-box; }
            body {
                background: #ffffff; margin: 0; padding: 20px;
                font-family: 'Caveat', cursive; color: #222; font-size: 24px;
            }
            .blatt { width: 100%; max-width: 800px; margin: 0 auto; padding: 40px; }
            h2 { border-bottom: 3px solid #000; padding-bottom: 15px; font-size: 36px; margin-bottom: 30px; }
            .question { font-weight: bold; margin-bottom: 20px; font-size: 28px; }
            .options { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; }
            button {
                background: #f0f0f0; border: 1px solid #333; padding: 10px 20px;
                cursor: pointer; font-family: 'Caveat', cursive; font-size: 22px;
                border-radius: 8px; text-align: left;
            }
            button:hover { background: #e0e0e0; }
            .correct { background: #d4edda !important; border-color: #28a745 !important; }
            .incorrect { background: #f8d7da !important; border-color: #d63031 !important; }
            #feedback { margin-bottom: 20px; padding: 15px; border-radius: 8px; display: none; }
            #next-btn { background: #333; color: #fff; padding: 10px 25px; border-radius: 8px; border: none; cursor: pointer; }
        </style>
</head>
<body>
<div class="blatt">
    <h2 id="header">🚛 BKrFQG TQ 1-6 Quiz 16</h2>
    <div id="quiz-container">
        <div id="question-text" class="question"></div>
        <div id="options" class="options"></div>
        <div id="feedback"></div>
        <button id="next-btn" style="display:none" onclick="nextQuestion()">Nächste Frage</button>
    </div>
</div>

<script>
const quizData = [
    { q: "Welche Hauptaufgabe hat der Retarder beim LKW?", a: ["Beschleunigung des Fahrzeugs", "Verschleißfreies Dauerbremsen", "Lenkunterstützung", "Verbesserung der Federung"], c: 1 },
    { q: "Wie lang ist die vorgeschriebene Lenkzeitunterbrechung nach 4,5 Stunden Lenkzeit?", a: ["30 Minuten", "45 Minuten", "60 Minuten", "15 Minuten"], c: 1 },
    { q: "Welche Auswirkung hat eine starke Überladung des LKWs?", a: ["Bessere Straßenhaftung", "Erhöhte Instabilität und Sicherheitsrisiko", "Geringerer Reifenverschleiß", "Niedrigerer Kraftstoffverbrauch"], c: 1 },
    { q: "Was gibt die orangefarbene Warntafel (Gefahrgut) an?", a: ["Gefahrennummer und Stoffnummer", "Nur den Firmennamen", "Höchstzulässige Geschwindigkeit", "Reifentyp"], c: 0 },
    { q: "Was versteht man unter 'Vorausschauendem Fahren'?", a: ["Schnellstmöglich beschleunigen", "Sicherheit erhöhen und Kraftstoff sparen", "Nur auf den Tacho achten", "Nur bremsen, wenn es absolut nötig ist"], c: 1 },
    { q: "Wie hoch ist die maximal zulässige wöchentliche Lenkzeit?", a: ["45 Stunden", "56 Stunden", "90 Stunden", "40 Stunden"], c: 1 },
    { q: "Was ist ein CMR-Frachtbrief?", a: ["Internationaler Frachtbrief", "Ein Beleg für die Maut", "Eine Kennzeichnung für Reifen", "Ein Wartungsplan für die Werkstatt"], c: 0 },
    { q: "Welchen Vorteil hat ein niedriger Schwerpunkt der Ladung?", a: ["Kippgefahr steigt", "Kippgefahr sinkt / Bessere Stabilität", "Kraftstoffverbrauch steigt", "Reifenabrieb steigt"], c: 1 },
    { q: "Wofür steht die Abkürzung ABS?", a: ["Antiblockiersystem", "Automatisches Bremssystem", "Anhänger-Brems-System", "Antriebs-Block-Schutz"], c: 0 },
    { q: "Was muss bei der Abfahrtskontrolle bezüglich der Beleuchtung geprüft werden?", a: ["Nur das Bremslicht", "Alle Lichtfunktionen des Fahrzeugs", "Nur die Scheinwerfer", "Nur die Blinker"], c: 1 }
];

let currentQ = 0; let score = 0;

function loadQuestion() {
    const data = quizData[currentQ];
    document.getElementById('question-text').innerText = (currentQ + 1) + ". " + data.q;
    const container = document.getElementById('options');
    container.innerHTML = '';
    document.getElementById('feedback').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';
    data.a.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.innerText = opt;
        btn.onclick = () => check(i);
        container.appendChild(btn);
    });
}
function check(i) {
    const d = quizData[currentQ];
    const btns = document.querySelectorAll('.options button');
    btns.forEach(b => b.disabled = true);
    if(i === d.c) {
        btns[i].classList.add('correct');
        score++;
    } else {
        btns[i].classList.add('incorrect');
        btns[d.c].classList.add('correct');
    }
    document.getElementById('feedback').style.display = 'block';
    document.getElementById('feedback').innerText = i === d.c ? "Richtig!" : "Falsch.";
    document.getElementById('next-btn').style.display = 'block';
}
function nextQuestion() {
    currentQ++;
    if(currentQ < quizData.length) loadQuestion();
    else document.getElementById('quiz-container').innerHTML = `<h1>Fertig!</h1><p>Punktzahl: ${score} / ${quizData.length}</p>`;
}
loadQuestion();
</script>
</body>
</html>
