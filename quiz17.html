<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TQ 1-6 Quiz 17</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
        <style>
            * { box-sizing: border-box; }
            body {
                background: #ffffff; margin: 0; padding: 20px;
                font-family: 'Caveat', cursive; color: #222; font-size: 24px;
            }
            .blatt { width: 100%; max-width: 800px; margin: 0 auto; padding: 40px; }
            h2 { border-bottom: 3px solid #000; padding-bottom: 15px; font-size: 36px; margin-bottom: 30px; }
            .question { font-weight: bold; margin-bottom: 20px; font-size: 28px; }
            .options { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; }
            button {
                background: #f0f0f0; border: 1px solid #333; padding: 10px 20px;
                cursor: pointer; font-family: 'Caveat', cursive; font-size: 22px;
                border-radius: 8px; text-align: left;
            }
            button:hover { background: #e0e0e0; }
            .correct { background: #d4edda !important; border-color: #28a745 !important; }
            .incorrect { background: #f8d7da !important; border-color: #d63031 !important; }
            #feedback { margin-bottom: 20px; padding: 15px; border-radius: 8px; display: none; }
            #next-btn { background: #333; color: #fff; padding: 10px 25px; border-radius: 8px; border: none; cursor: pointer; }
        </style>
</head>
<body>
<div class="blatt">
    <h2 id="header">🚛 BKrFQG TQ 1-6 Quiz 17</h2>
    <div id="quiz-container">
        <div id="question-text" class="question"></div>
        <div id="options" class="options"></div>
        <div id="feedback"></div>
        <button id="next-btn" style="display:none" onclick="nextQuestion()">Nächste Frage</button>
    </div>
</div>

<script>
const quizData = [
    { q: "Wie hoch ist die maximale Fahrzeughöhe (ohne Ausnahmegenehmigung) in Deutschland?", a: ["3,50 Meter", "4,00 Meter", "4,50 Meter", "5,00 Meter"], c: 1 },
    { q: "Was passiert bei Aquaplaning (Aufschwimmen)?", a: ["Der Bremsweg verkürzt sich", "Die Lenkbarkeit geht verloren", "Das Fahrzeug wird schneller", "Der Motor geht aus"], c: 1 },
    { q: "In welchen Zeitabständen muss die Fahrerkarte spätestens ausgelesen werden?", a: ["Alle 7 Tage", "Spätestens alle 28 Tage", "Alle 6 Monate", "Gar nicht"], c: 1 },
    { q: "Welche Bremskraftverteilung ist bei einem EBS-System besonders wichtig?", a: ["Immer konstant gleich", "Lastabhängig", "Nur auf der Vorderachse", "Nur bei Nässe"], c: 1 },
    { q: "Was bewirkt der Retarder im LKW?", a: ["Schnellere Beschleunigung", "Verschleißarmes Dauerbremsen", "Automatische Reifendruckregelung", "GPS-Navigation"], c: 1 },
    { q: "Was versteht man unter 'Niederzurren' bei der Ladungssicherung?", a: ["Ladungssicherung durch Kraftschluss", "Ladungssicherung durch Formschluss", "Ladung einfach abdecken", "Ladung festkleben"], c: 0 },
    { q: "Was passiert, wenn man mit zu wenig Reifendruck fährt?", a: ["Der Kraftstoffverbrauch sinkt", "Die Reifen überhitzen und verbrauchen mehr Sprit", "Das Fahrzeug bremst besser", "Der Reifenverschleiß verringert sich"], c: 1 },
    { q: "Wie lange ist die reguläre tägliche Ruhezeit ohne Verkürzung?", a: ["9 Stunden", "10 Stunden", "11 Stunden", "12 Stunden"], c: 2 },
    { q: "Was bedeutet ein Verkehrszeichen mit einem LKW-Symbol und der Zusatztafel '7,5t'?", a: ["Mindestgewicht", "Verbot für Fahrzeuge über 7,5t", "Empfohlene Geschwindigkeit", "Parkverbot"], c: 1 },
    { q: "Warum ist ein korrekt eingestellter Sitz so wichtig?", a: ["Nur für den Komfort", "Ermüdungsfreies Fahren und Sicherheit", "Um schneller zu schalten", "Um besser Radio zu hören"], c: 1 }
];

let currentQ = 0; let score = 0;

function loadQuestion() {
    const data = quizData[currentQ];
    document.getElementById('question-text').innerText = (currentQ + 1) + ". " + data.q;
    const container = document.getElementById('options');
    container.innerHTML = '';
    document.getElementById('feedback').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';
    data.a.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.innerText = opt;
        btn.onclick = () => check(i);
        container.appendChild(btn);
    });
}
function check(i) {
    const d = quizData[currentQ];
    const btns = document.querySelectorAll('.options button');
    btns.forEach(b => b.disabled = true);
    if(i === d.c) {
        btns[i].classList.add('correct');
        score++;
    } else {
        btns[i].classList.add('incorrect');
        btns[d.c].classList.add('correct');
    }
    document.getElementById('feedback').style.display = 'block';
    document.getElementById('feedback').innerText = i === d.c ? "Richtig!" : "Falsch.";
    document.getElementById('next-btn').style.display = 'block';
}
function nextQuestion() {
    currentQ++;
    if(currentQ < quizData.length) loadQuestion();
    else document.getElementById('quiz-container').innerHTML = `<h1>Fertig!</h1><p>Punktzahl: ${score} / ${quizData.length}</p>`;
}
loadQuestion();
</script>
</body>
</html>
