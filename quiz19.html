<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TQ 1-6 Quiz 19</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
        <style>
            * { box-sizing: border-box; }
            body {
                background: #ffffff; margin: 0; padding: 20px;
                font-family: 'Caveat', cursive; color: #222; font-size: 24px;
            }
            .blatt { width: 100%; max-width: 800px; margin: 0 auto; padding: 40px; }
            h2 { border-bottom: 3px solid #000; padding-bottom: 15px; font-size: 36px; margin-bottom: 30px; }
            .question { font-weight: bold; margin-bottom: 20px; font-size: 28px; }
            .options { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; }
            button {
                background: #f0f0f0; border: 1px solid #333; padding: 10px 20px;
                cursor: pointer; font-family: 'Caveat', cursive; font-size: 22px;
                border-radius: 8px; text-align: left;
            }
            button:hover { background: #e0e0e0; }
            .correct { background: #d4edda !important; border-color: #28a745 !important; }
            .incorrect { background: #f8d7da !important; border-color: #d63031 !important; }
            #feedback { margin-bottom: 20px; padding: 15px; border-radius: 8px; display: none; }
            #next-btn { background: #333; color: #fff; padding: 10px 25px; border-radius: 8px; border: none; cursor: pointer; }
        </style>
</head>
<body>
<div class="blatt">
    <h2 id="header">🚛 BKrFQG TQ 1-6 Quiz 19</h2>
    <div id="quiz-container">
        <div id="question-text" class="question"></div>
        <div id="options" class="options"></div>
        <div id="feedback"></div>
        <button id="next-btn" style="display:none" onclick="nextQuestion()">Nächste Frage</button>
    </div>
</div>

<script>
const quizData = [
    { q: "Was bedeutet 'Formschluss' bei der Ladungssicherung?", a: ["Ladung ist mit Seilen gesichert", "Ladung steht lückenlos an den Bordwänden", "Ladung ist mit Klebeband fixiert", "Ladung ist mit Kette festgezogen"], c: 1 },
    { q: "Welches Symbol am Tachograph steht für die tägliche Ruhezeit?", a: ["Ein Lenkrad", "Ein Bett", "Gekreuzte Hämmer", "Ein Quadrat"], c: 1 },
    { q: "Was passiert bei vielen modernen LKW, wenn der AdBlue-Tank leer ist?", a: ["Der Motor geht sofort aus", "Die Motorleistung wird elektronisch gedrosselt", "Das Fahrzeug fährt schneller", "Die Bremsen fallen aus"], c: 1 },
    { q: "Wie tief muss das Profil eines Reifens an einem LKW mindestens sein?", a: ["1,0 mm", "1,6 mm", "2,5 mm", "4,0 mm"], c: 1 },
    { q: "Was ist bei einem Stau im Tunnel besonders wichtig?", a: ["Radio lauter machen", "Motor ausschalten und Fenster geschlossen halten", "Aus dem Fahrzeug steigen und herumlaufen", "Immer den Motor laufen lassen"], c: 1 },
    { q: "Wozu dient der Geschwindigkeitsbegrenzer am LKW?", a: ["Zur Einhaltung der gesetzlichen Höchstgeschwindigkeit", "Um Benzin zu sparen", "Um das Radio zu steuern", "Zum Schutz der Reifen"], c: 0 },
    { q: "Welche Führerscheinklasse ist für LKW über 3,5t zwingend erforderlich?", a: ["Klasse B", "Klasse C", "Klasse A", "Klasse D"], c: 1 },
    { q: "Wie viele tägliche Ruhezeiten dürfen zwischen zwei wöchentlichen Ruhezeiten verkürzt sein?", a: ["Keine", "Bis zu drei", "Bis zu sechs", "Unbegrenzt"], c: 1 },
    { q: "Was ist die Hauptursache für 'Aquaplaning'?", a: ["Zu schnelles Fahren bei Nässe", "Zu trockene Fahrbahn", "Zu wenig Luftdruck", "Falsche Ladung"], c: 0 },
    { q: "Welches Dokument ist bei Gefahrguttransporten immer mitzuführen?", a: ["Ein Logbuch", "Das Beförderungspapier", "Ein Foto des Fahrzeugs", "Die Kfz-Versicherung"], c: 1 }
];

let currentQ = 0; let score = 0;

function loadQuestion() {
    const data = quizData[currentQ];
    document.getElementById('question-text').innerText = (currentQ + 1) + ". " + data.q;
    const container = document.getElementById('options');
    container.innerHTML = '';
    document.getElementById('feedback').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';
    data.a.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.innerText = opt;
        btn.onclick = () => check(i);
        container.appendChild(btn);
    });
}
function check(i) {
    const d = quizData[currentQ];
    const btns = document.querySelectorAll('.options button');
    btns.forEach(b => b.disabled = true);
    if(i === d.c) {
        btns[i].classList.add('correct');
        score++;
    } else {
        btns[i].classList.add('incorrect');
        btns[d.c].classList.add('correct');
    }
    document.getElementById('feedback').style.display = 'block';
    document.getElementById('feedback').innerText = i === d.c ? "Richtig!" : "Falsch.";
    document.getElementById('next-btn').style.display = 'block';
}
function nextQuestion() {
    currentQ++;
    if(currentQ < quizData.length) loadQuestion();
    else document.getElementById('quiz-container').innerHTML = `<h1>Fertig!</h1><p>Punktzahl: ${score} / ${quizData.length}</p>`;
}
loadQuestion();
</script>
</body>
</html>
