<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TQ 1-6 Quiz 20</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
        <style>
            * { box-sizing: border-box; }
            body {
                background: #ffffff; margin: 0; padding: 20px;
                font-family: 'Caveat', cursive; color: #222; font-size: 24px;
            }
            .blatt { width: 100%; max-width: 800px; margin: 0 auto; padding: 40px; }
            h2 { border-bottom: 3px solid #000; padding-bottom: 15px; font-size: 36px; margin-bottom: 30px; }
            .question { font-weight: bold; margin-bottom: 20px; font-size: 28px; }
            .options { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; }
            button {
                background: #f0f0f0; border: 1px solid #333; padding: 10px 20px;
                cursor: pointer; font-family: 'Caveat', cursive; font-size: 22px;
                border-radius: 8px; text-align: left;
            }
            button:hover { background: #e0e0e0; }
            .correct { background: #d4edda !important; border-color: #28a745 !important; }
            .incorrect { background: #f8d7da !important; border-color: #d63031 !important; }
            #feedback { margin-bottom: 20px; padding: 15px; border-radius: 8px; display: none; }
            #next-btn { background: #333; color: #fff; padding: 10px 25px; border-radius: 8px; border: none; cursor: pointer; }
        </style>
</head>
<body>
<div class="blatt">
    <h2 id="header">🚛 BKrFQG TQ 1-6 Quiz 20</h2>
    <div id="quiz-container">
        <div id="question-text" class="question"></div>
        <div id="options" class="options"></div>
        <div id="feedback"></div>
        <button id="next-btn" style="display:none" onclick="nextQuestion()">Nächste Frage</button>
    </div>
</div>

<script>
const quizData = [
    { q: "Was ist bei einem Ausfall der ABS-Kontrollleuchte während der Fahrt zu tun?", a: ["Weiterfahren, da das System unwichtig ist", "Sofort anhalten und Werkstatt aufsuchen", "Radio ausschalten", "Reifendruck prüfen"], c: 1 },
    { q: "Wie wirkt sich ein niedrigerer Gleit-Reibbeiwert (µ) bei der Ladungssicherung aus?", a: ["Die benötigte Sicherungskraft steigt", "Die Ladung rutscht weniger", "Man braucht weniger Gurte", "Es ändert sich nichts"], c: 0 },
    { q: "Welche Funktion hat die Motorbremse hauptsächlich?", a: ["Verschleißarmes Dauerbremsen", "Schnellere Beschleunigung", "Schonung des Getriebes", "Kühlung des Motors"], c: 0 },
    { q: "Was sind typische Anzeichen für beginnende Übermüdung am Steuer?", a: ["Häufiges Gähnen und Tunnelblick", "Guter Radioempfang", "Konstantes Tempo", "Gute Sicht"], c: 0 },
    { q: "Darf man eine durchgezogene Linie überfahren, um einen Radfahrer zu überholen?", a: ["Ja, immer", "Nein, verboten", "Nur bei Nacht", "Nur bei Regen"], c: 1 },
    { q: "Wie lautet die tägliche Standard-Lenkzeit gemäß EU-Verordnung?", a: ["7 Stunden", "8 Stunden", "9 Stunden", "10 Stunden"], c: 2 },
    { q: "Was passiert meist bei einem Reifenplatzer an der Vorderachse?", a: ["Das Fahrzeug zieht stark zur Seite", "Das Fahrzeug bleibt in der Spur", "Das Fahrzeug beschleunigt", "Das Radio geht aus"], c: 0 },
    { q: "Was bedeutet 'schaltfaul fahren' im Sinne einer wirtschaftlichen Fahrweise?", a: ["Frühes Hochschalten", "Spätes Hochschalten", "Gar nicht schalten", "Nur im ersten Gang fahren"], c: 0 },
    { q: "Wie lange müssen Ausdrucke der Tachographendaten (bei Kartenverlust) mitgeführt werden?", a: ["Gar nicht", "Mindestens 28 Tage", "Nur 1 Tag", "1 Jahr"], c: 1 },
    { q: "Wer ist der 'Frachtführer' im Transportwesen?", a: ["Der Empfänger der Ware", "Derjenige, der den Transport durchführt", "Der Lagerarbeiter", "Der Verkäufer der Ware"], c: 1 }
];

let currentQ = 0; let score = 0;

function loadQuestion() {
    const data = quizData[currentQ];
    document.getElementById('question-text').innerText = (currentQ + 1) + ". " + data.q;
    const container = document.getElementById('options');
    container.innerHTML = '';
    document.getElementById('feedback').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';
    data.a.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.innerText = opt;
        btn.onclick = () => check(i);
        container.appendChild(btn);
    });
}
function check(i) {
    const d = quizData[currentQ];
    const btns = document.querySelectorAll('.options button');
    btns.forEach(b => b.disabled = true);
    if(i === d.c) {
        btns[i].classList.add('correct');
        score++;
    } else {
        btns[i].classList.add('incorrect');
        btns[d.c].classList.add('correct');
    }
    document.getElementById('feedback').style.display = 'block';
    document.getElementById('feedback').innerText = i === d.c ? "Richtig!" : "Falsch.";
    document.getElementById('next-btn').style.display = 'block';
}
function nextQuestion() {
    currentQ++;
    if(currentQ < quizData.length) loadQuestion();
    else document.getElementById('quiz-container').innerHTML = `<h1>Fertig!</h1><p>Punktzahl: ${score} / ${quizData.length}</p>`;
}
loadQuestion();
</script>
</body>
</html>
