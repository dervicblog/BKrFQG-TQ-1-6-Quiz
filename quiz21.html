<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TQ 1-6 Quiz 21 - Ladungssicherung & Technik</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
        <style>
            * { box-sizing: border-box; }
            body {
                background: #ffffff; margin: 0; padding: 20px;
                font-family: 'Caveat', cursive; color: #222; font-size: 24px;
            }
            .blatt { width: 100%; max-width: 800px; margin: 0 auto; padding: 40px; }
            h2 { border-bottom: 3px solid #000; padding-bottom: 15px; font-size: 36px; margin-bottom: 30px; }
            .question { font-weight: bold; margin-bottom: 20px; font-size: 28px; }
            .options { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; }
            button {
                background: #f0f0f0; border: 1px solid #333; padding: 10px 20px;
                cursor: pointer; font-family: 'Caveat', cursive; font-size: 22px;
                border-radius: 8px; text-align: left;
            }
            button:hover { background: #e0e0e0; }
            .correct { background: #d4edda !important; border-color: #28a745 !important; }
            .incorrect { background: #f8d7da !important; border-color: #d63031 !important; }
            #feedback { margin-bottom: 20px; padding: 15px; border-radius: 8px; display: none; }
            #next-btn { background: #333; color: #fff; padding: 10px 25px; border-radius: 8px; border: none; cursor: pointer; }
        </style>
</head>
<body>
<div class="blatt">
    <h2 id="header">🚛 BKrFQG TQ 1-6 Quiz 21</h2>
    <div id="quiz-container">
        <div id="question-text" class="question"></div>
        <div id="options" class="options"></div>
        <div id="feedback"></div>
        <button id="next-btn" style="display:none" onclick="nextQuestion()">Nächste Frage</button>
    </div>
</div>

<script>
const quizData = [
    { q: "Welche Funktion haben Unterlegkeile (drezal) bei abgestellten Fahrzeugen?", a: ["Sie dekorieren die Reifen", "Sie verhindern das Wegrollen des Fahrzeugs", "Sie verhindern das Einsinken im Boden", "Sie kühlen die Bremse"], c: 1 },
    { q: "Warum verwendet man einen Kantenschutz (Schutzecke) beim Zurren?", a: ["Damit der Gurt nicht durchscheuert und die Ware nicht beschädigt wird", "Um den Gurt besser zu sehen", "Um das Fahrzeug zu schmücken", "Nur bei Gefahrgutpflicht"], c: 0 },
    { q: "Was muss man vor der Benutzung eines Zurrgurts immer prüfen?", a: ["Das Datum der Herstellung", "Den Zustand von Gurtband, Ratsche und Etikett", "Nur die Farbe des Gurtes", "Die Länge des Gurtes"], c: 1 },
    { q: "Was bedeutet es, wenn das Etikett am Zurrgurt unleserlich ist?", a: ["Der Gurt darf weiterverwendet werden", "Der Gurt muss sofort ausgemustert werden", "Man muss es neu beschriften", "Es hat keine Bedeutung"], c: 1 },
    { q: "Welche Aufgabe haben Antirutschmatten bei der Ladung?", a: ["Sie machen die Ladung schwerer", "Sie erhöhen die Reibung und verhindern das Verrutschen", "Sie verhindern das Rosten", "Sie kühlen die Ladefläche"], c: 1 },
    { q: "Was ist ein 'Kantholz' in der Ladungssicherung?", a: ["Ein Werkzeug zur Reparatur", "Ein Hilfsmittel zum Aufbau von Formschluss", "Ein Ersatz für den Gurt", "Ein Abfallprodukt"], c: 1 },
    { q: "Wie nennt man die Einrichtung, die ein Blockieren der Räder beim Bremsen verhindert?", a: ["ABS", "ESP", "EBS", "Retarder"], c: 0 },
    { q: "Welches Ziel hat das 'Niederzurren' der Ladung?", a: ["Die Ladung durch Reibungserhöhung sichern", "Die Ladung in den Boden drücken", "Die Ladung schneller entladen", "Die Ladung unbeweglich machen"], c: 0 },
    { q: "Darf man beim LKW eine beschädigte Plane einfach so lassen?", a: ["Ja, das ist egal", "Nein, sie muss repariert werden (Sicherheitsrisiko)", "Nur bei trockenem Wetter", "Nur bei Leerfahrten"], c: 1 },
    { q: "Was zeigt die 'StVZO' (Straßenverkehrs-Zulassungs-Ordnung) an?", a: ["Lenk- und Ruhezeiten", "Technische Vorschriften für Fahrzeuge", "Wetterdaten", "Mautgebühren"], c: 1 }
];

let currentQ = 0; let score = 0;

function loadQuestion() {
    const data = quizData[currentQ];
    document.getElementById('question-text').innerText = (currentQ + 1) + ". " + data.q;
    const container = document.getElementById('options');
    container.innerHTML = '';
    document.getElementById('feedback').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';
    data.a.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.innerText = opt;
        btn.onclick = () => check(i);
        container.appendChild(btn);
    });
}
function check(i) {
    const d = quizData[currentQ];
    const btns = document.querySelectorAll('.options button');
    btns.forEach(b => b.disabled = true);
    if(i === d.c) {
        btns[i].classList.add('correct');
        score++;
    } else {
        btns[i].classList.add('incorrect');
        btns[d.c].classList.add('correct');
    }
    document.getElementById('feedback').style.display = 'block';
    document.getElementById('feedback').innerText = i === d.c ? "Richtig!" : "Falsch.";
    document.getElementById('next-btn').style.display = 'block';
}
function nextQuestion() {
    currentQ++;
    if(currentQ < quizData.length) loadQuestion();
    else document.getElementById('quiz-container').innerHTML = `<h1>Fertig!</h1><p>Punktzahl: ${score} / ${quizData.length}</p>`;
}
loadQuestion();
</script>
</body>
</html>
